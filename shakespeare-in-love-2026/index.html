<!DOCTYPE html>
<html lang="en" class="ng-page">
<head>
  <meta name="robots" content="noindex, nofollow">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Criterion Foyer Display</title>
<link rel="stylesheet" href="style.css?v=20261012perf1">
</head>
<body class="nextgen-foyer" data-phase="preshow">
<div class="ng-shell">
  <div class="ng-watermark" aria-hidden="true"></div>

  <!-- Theme-driven, non-content ambient layer. -->
  <div class="ng-ambient" aria-hidden="true">
    <div class="ng-texture"></div>
  </div>

  <div class="ng-topline">
    <div class="ng-phase" id="phase-label">Loading</div>
    <div class="ng-show" id="show-label">Criterion Theatre</div>
  </div>
  <div class="ng-stage" id="stage"></div>
  <div class="ng-caption" id="caption"></div>

  <div class="criterion-mark" title="The Criterion Theatre, Earlsdon" aria-hidden="true"></div>
</div>

<script type="module">
  import { getActiveShow, getVisitingCompany, startShowPolling } from "./js/show-resolver.js?v=20260909motion3";
  import { loadTheme } from "./js/theme-loader.js?v=20260909motion3";
  import { Scheduler } from "./js/scheduler.js?v=20260909motion3";
  import { renderSlideHTML, canRenderSlide, holdingState, holdingWindows, performanceState, performanceDefaultPlaylist } from "./js/slide-templates.js?v=20261012perf1";

  const params = new URLSearchParams(window.location.search);
  const dwellSeconds = params.get("dwell");
  function resolveRoute(searchParams) {
    const raw = (searchParams.get("phase") || searchParams.get("scene") || "preshow")
      .trim()
      .toLowerCase();
    const phases = new Set(["preshow", "interval", "postshow", "holding", "performance"]);
    const singleRoutes = {
      welcome: "welcome",
      tonight: "show-info",
    };
    if (raw === "coming-soon") {
      return {
        name: raw,
        phase: "preshow",
        template: null,
        heldTemplates: ["next-production", "next-production-2"],
      };
    }
    if (phases.has(raw)) {
      // C21: &pip=1 is the card-plus-small-picture layout (design section
      // 5). It means something only on the performance phase, and the key
      // stays absent otherwise so the route shape is unchanged elsewhere.
      const pip = raw === "performance" && searchParams.get("pip") === "1";
      return {
        name: raw,
        phase: raw,
        template: null,
        ...(pip ? { pip: true } : {}),
      };
    }
    if (singleRoutes[raw]) {
      return { name: raw, phase: "preshow", template: singleRoutes[raw] };
    }
    return null;
  }

  function escapeHTML(value) {
    return String(value).replace(/[&<>"']/g, (character) => ({
      "&": "&amp;",
      "<": "&lt;",
      ">": "&gt;",
      '"': "&quot;",
      "'": "&#39;",
    })[character]);
  }

  function referenceId(ref) {
    if (!ref) {
      return null;
    }
    const hashIndex = ref.indexOf("#");
    return hashIndex >= 0 ? ref.slice(hashIndex + 1) : ref;
  }

  let route = resolveRoute(params);
  let phase = route?.name || null;
  const houseOpen = params.get("houseOpen") === "1";

  // --- Preview / review mode (?preview=1) state. Inert in broadcast. ---
  const preview = params.get("preview") === "1";
  let previewPaused = false;
  let previewDwellOverride = null;
  let remainingMs = 0;
  let playbackDeadline = 0;
  const previewHistory = [];
  let previewIndex = -1;
  let previewBarBuilt = false;
  let currentPlaylistItems = [];
  let previewLinkNotice = "";
  const stage = document.getElementById("stage");
  const caption = document.getElementById("caption");
  const showLabel = document.getElementById("show-label");
  const phaseLabel = document.getElementById("phase-label");
  document.body.dataset.phase = route?.phase || "unavailable";
  let scheduler = null;
  let schedulerPlaylist = null;
  let schedulerOptions = null;
  // The holding state last seen by advance() - a change mid-dwell rebuilds
  // the scheduler so the new state's items enter the rotation.
  let holdingStateSeen = null;
  // Same again for the performance phase's act-one / act-two / running (C21).
  let performanceStateSeen = null;
  let timer = null;
  let countdownTimer = null;
  let wakeupTimer = null;
  let showInfo = null;
  let ctx = null;
  const missingSources = new Set();

  // The holding phase carries three states (wind-down / overnight / wake-up)
  // inside one phase; CSS keys the blackout on data-holding-state="overnight"
  // only. Defaulting to overnight on any route means a fresh page paints
  // black until the first render resolves the real state - the fail-safe is
  // the dark screen, never a lit one.
  function syncHoldingStateAttr() {
    if (route?.phase === "holding") {
      document.body.dataset.holdingState = document.body.dataset.holdingState || "overnight";
    } else {
      delete document.body.dataset.holdingState;
    }
  }
  syncHoldingStateAttr();

  async function fetchJson(url) {
    const response = await fetch(`${url}${url.includes("?") ? "&" : "?"}t=${Date.now()}`, { cache: "no-store" });
    if (!response.ok) {
      throw new Error(`Failed to load ${url}`);
    }
    return response.json();
  }

  function describeItem(item) {
    if (!item) {
      return null;
    }
    if (item.template) {
      return item.template;
    }
    if (!item.source) {
      return item.tag || null;
    }
    try {
      const path = new URL(item.source).pathname;
      return path.split("/").slice(-2).join("/");
    } catch (error) {
      return item.source;
    }
  }

  async function updateState(current, next) {
    if (preview) return; // A review must never send live state, even on a live host.
    await fetch("api/state", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        show: showInfo?.id || null,
        phase,
        item: describeItem(current),
        next_item: describeItem(next),
      }),
    });
  }

  function setCaption() {
    caption.textContent = "";
  }

  function clearTimer() {
    if (timer) {
      window.clearTimeout(timer);
      timer = null;
    }
    if (countdownTimer) {
      window.clearInterval(countdownTimer);
      countdownTimer = null;
    }
    if (wakeupTimer) {
      window.clearInterval(wakeupTimer);
      wakeupTimer = null;
    }
  }

  function renderMissing(item) {
    if (!item?.source || missingSources.has(item.source)) {
      return;
    }
    missingSources.add(item.source);
    console.warn("Missing foyer asset:", item.source);
  }

  function setStoryPaused(paused) {
    stage.classList.toggle("motion-paused", paused);
    const montage = stage.querySelector(".story-montage");
    montage?.classList.toggle("paused", paused);
    for (const animation of stage.getAnimations({ subtree: true })) {
      if (paused) animation.pause();
      else animation.play();
    }
    applyStageVideoState();
  }

  /* In-card clips (.video-fg, C15) obey the same freeze rules as the CSS
     animations: preview pause holds every video on the stage, and reduced
     motion turns a clip back into its poster still. A full-frame media item
     (.ng-media) answers to preview pause only - reduced motion there is a
     deliberate URL request, not this machinery's call. The clip is also
     rewound and hidden by CSS under reduced motion, so the still the
     audience sees is the poster image underneath, never a black frame.
     autoplay is stripped while held so a clip arriving during a pause
     cannot race past the pause() and start anyway. Called from
     setStoryPaused, which renderSlide runs on every card, so a card
     arriving while paused or reduced starts held. */
  function applyStageVideoState() {
    const pausedWanted = preview && previewPaused;
    const reduced = document.body.classList.contains("motion-reduced");
    for (const video of stage.querySelectorAll("video")) {
      const stillWanted = reduced && video.classList.contains("video-fg");
      if (pausedWanted || stillWanted) {
        video.removeAttribute("autoplay");
        video.pause();
        if (stillWanted) {
          try { video.currentTime = 0; } catch (error) { /* no metadata yet */ }
        }
      } else {
        const attempt = video.play();
        if (attempt && typeof attempt.catch === "function") {
          attempt.catch(() => {});
        }
      }
    }
  }

  // --- Motion policy -----------------------------------------------------
  // A foyer screen is a broadcast surface, not a personal device: nobody
  // set the host's OS accessibility toggle with a theatre audience in mind.
  // The 21 September 2026 AURORA defect was exactly that - Windows
  // "Animation effects" off surfaced as prefers-reduced-motion: reduce and
  // flattened every story reveal. So when nothing asks otherwise the
  // default is `full`, not `system` (decided 22 September 2026 - do not
  // "fix" it back). `?motion=system` still honours the OS preference and
  // `?motion=reduced` forces stills.
  const motionMediaQuery = window.matchMedia("(prefers-reduced-motion: reduce)");

  function requestedMotionMode() {
    // The preview bar's select drives once it exists; setupPreview seeds it
    // from ?motion=, so an explicit URL still wins on first resolution.
    const select = document.getElementById("ngp-motion");
    if (preview && select) {
      return select.value;
    }
    const fromUrl = params.get("motion");
    if (["full", "reduced", "system"].includes(fromUrl)) {
      return fromUrl;
    }
    return "full";
  }

  function updateMotionPreference() {
    const requested = requestedMotionMode();
    document.body.classList.remove("motion-full", "motion-reduced");
    let mode = "Full";
    if (requested === "full") {
      document.body.classList.add("motion-full");
    } else if (requested === "reduced") {
      document.body.classList.add("motion-reduced");
      mode = "Reduced";
    } else if (motionMediaQuery.matches) {
      document.body.classList.add("motion-reduced");
      mode = "Reduced (system)";
    } else {
      mode = "Full (system)";
    }
    const readout = document.getElementById("ngp-motion-mode");
    if (readout) {
      readout.textContent = mode;
    }
    setStoryPaused(previewPaused);
    updateMotionNotice();
  }

  // Resolve on every load - broadcast included - and re-resolve if the
  // OS-level preference changes under a `system` mode.
  motionMediaQuery.addEventListener("change", updateMotionPreference);
  updateMotionPreference();

  function scheduleCurrent() {
    if (preview && previewPaused) return;
    playbackDeadline = performance.now() + remainingMs;
    timer = window.setTimeout(() => advance(), Math.max(1, remainingMs));
  }

  function stepStoryFrame(direction) {
    const montage = stage.querySelector(".story-montage");
    if (!montage) {
      return;
    }
    const frames = Array.from(montage.querySelectorAll(".story-frame"));
    if (!frames.length) {
      return;
    }
    previewPause();
    const dwellMs = Number(montage.dataset.dwell) * 1000;
    const animations = stage.getAnimations({ subtree: true });
    const elapsed = Number(animations.find(a => a.animationName?.startsWith("story-reveal"))?.currentTime) || 0;
    const interval = frames.length === 3 ? dwellMs * 0.238 : dwellMs * 0.48;
    let current = Math.min(frames.length - 1, Math.floor(elapsed / interval));
    current = (current + direction + frames.length) % frames.length;
    const target = current ? current * interval + dwellMs * 0.045 : 0;
    animations.forEach(animation => { animation.currentTime = target; });
    remainingMs = Math.max(1, dwellMs - target);
  }

  let photoObserver;
  function fitPhotoWindows() {
    photoObserver?.disconnect();
    const fit = (frame) => {
      const img = frame.querySelector('.photo-fg');
      const window = frame.querySelector('.photo-window');
      if (!img?.naturalWidth || !window || !frame.isConnected) return;
      const scale = Math.min(frame.clientWidth / img.naturalWidth, frame.clientHeight / img.naturalHeight);
      window.style.width = `${img.naturalWidth * scale}px`;
      window.style.height = `${img.naturalHeight * scale}px`;
    };
    photoObserver = new ResizeObserver(entries => entries.forEach(entry => fit(entry.target)));
    stage.querySelectorAll('.photo-presentation.contain').forEach(frame => {
      const img = frame.querySelector('.photo-fg');
      img?.addEventListener('load', () => fit(frame), { once: true });
      fit(frame);
      photoObserver.observe(frame);
    });
  }

  function renderSlide(entry) {
    document.body.classList.remove("media-active");
    ctx.countdown = getCountdownState();
    stage.innerHTML = renderSlideHTML(entry, ctx);
    // The blackout and chrome belong to the card being painted, so the
    // state attribute is stamped per render, not per phase load.
    if (ctx && route?.phase === "holding") {
      document.body.dataset.holdingState = holdingState(ctx).state;
    } else {
      delete document.body.dataset.holdingState;
    }
    // The performance state (C21): the card's own performance_state when it
    // carries one (preview steps the three cards under one clock state),
    // else the computed state.
    if (ctx && route?.phase === "performance") {
      document.body.dataset.performanceState =
        entry.performance_state || performanceState(ctx).state;
    } else {
      delete document.body.dataset.performanceState;
    }
    fitPhotoWindows();
    remainingMs = ((preview && previewDwellOverride) || entry.dwell_seconds || 5) * 1000;
    setStoryPaused(preview && previewPaused);
    if (entry.template === "countdown") {
      updateCountdown();
      countdownTimer = window.setInterval(updateCountdown, 60 * 1000);
    }
    startWakeUpTicker();
  }

  /* The wake-up card's countdown to doors-open ticks without re-rendering
     the card: once a second, which lands both regimes (whole minutes above
     15, mm:ss below) and the house-open NOW flip on the boundary tick. It
     honours the preview pause (clearTimer stops it, previewPlay re-arms it)
     and reduced motion (the minute format keeps running but the seconds
     display never appears - the number updates once a minute instead). */
  function updateWakeUpCountdown() {
    const card = stage.querySelector(".holding-wake-up");
    if (!card) {
      return;
    }
    const remainingMs = Number(card.dataset.houseOpen || 0) - Date.now();
    const leadEl = card.querySelector(".wu-lead");
    const countEl = card.querySelector(".wu-count");
    const reduced = document.body.classList.contains("motion-reduced");
    if (leadEl && countEl) {
      if (remainingMs <= 0) {
        leadEl.textContent = "Doors are open";
        countEl.textContent = "NOW";
      } else {
        leadEl.textContent = card.dataset.lead || "Doors open in";
        if (remainingMs <= 15 * 60000 && !reduced) {
          const totalSec = Math.ceil(remainingMs / 1000);
          countEl.textContent = `${String(Math.floor(totalSec / 60)).padStart(2, "0")}:${String(totalSec % 60).padStart(2, "0")}`;
        } else {
          countEl.innerHTML = `${Math.ceil(remainingMs / 60000)}<small>MIN</small>`;
        }
      }
    }
    // The "next" highlight follows the clock: the first row still in the
    // future carries it, whether that is doors open or, after they are open,
    // curtain.
    const now = Date.now();
    let marked = false;
    card.querySelectorAll(".wu-row").forEach(row => {
      const isNext = !marked && Number(row.dataset.at || 0) > now;
      row.classList.toggle("next", isNext);
      marked = marked || isNext;
    });
  }

  function startWakeUpTicker() {
    if (wakeupTimer) {
      window.clearInterval(wakeupTimer);
      wakeupTimer = null;
    }
    if (!stage.querySelector(".holding-wake-up")) {
      return;
    }
    updateWakeUpCountdown();
    if (!(preview && previewPaused)) {
      wakeupTimer = window.setInterval(updateWakeUpCountdown, 1000);
    }
  }

  function renderVideo(item) {
    photoObserver?.disconnect();
    document.body.classList.add("media-active");
    stage.innerHTML = "";
    const video = document.createElement("video");
    video.className = "ng-media";
    video.autoplay = !(preview && previewPaused);
    video.muted = true;
    video.playsInline = true;
    video.src = `${ctx.foyerPackBase.replace(/\/$/, "")}/${item.source.replace(/^\//, "")}`;
    video.onerror = () => {
      renderMissing(item);
      if (!(preview && previewPaused)) {
        advance();
      }
    };
    video.onended = () => {
      if (!(preview && previewPaused)) {
        advance();
      }
    };
    const videoMeta = ctx.videoItems[item.source] || item;
    if (videoMeta.captions?.required && videoMeta.captions?.verified !== true) {
      console.warn(
        "Spoken-word foyer video requires burnt-in open captions; playback is not blocked in Phase 1:",
        item.source,
      );
    }
    stage.appendChild(video);
  }

  function isVideo(item) {
    return Boolean(item?.source && /\.mp4($|\?)/i.test(item.source));
  }

  function dateAtTime(dateText, timeText) {
    if (!dateText || !/^\d{2}:\d{2}$/.test(timeText || "")) {
      return null;
    }
    const [year, month, day] = dateText.split("-").map(Number);
    const [hour, minute] = timeText.split(":").map(Number);
    return new Date(year, month - 1, day, hour, minute, 0, 0);
  }

  function minutesBetween(startText, endText) {
    const start = dateAtTime("2000-01-01", startText);
    let end = dateAtTime("2000-01-01", endText);
    if (!start || !end) {
      return null;
    }
    if (end < start) {
      end = new Date(end.getTime() + 24 * 60 * 60 * 1000);
    }
    return Math.round((end - start) / 60000);
  }

  function selectPerformance(performances) {
    const list = performances?.performances || [];
    const requestedDay = params.get("day");
    const today = new Date();
    const localDay = [
      today.getFullYear(),
      String(today.getMonth() + 1).padStart(2, "0"),
      String(today.getDate()).padStart(2, "0"),
    ].join("-");
    return list.find(entry => entry.date === requestedDay)
      || list.find(entry => entry.date === localDay)
      || list.find(entry => entry.date >= localDay)
      || list[list.length - 1]
      || null;
  }

  function countdownTarget(performance, showMeta) {
    if (!performance) {
      return null;
    }
    const intervalSignal = params.get("intervalNow") || params.get("now");
    const intervalMinutes = minutesBetween(
      performance.interval_at_estimated,
      performance.act_2_at_estimated,
    ) || Number(showMeta?.interval_minutes) || 20;
    if (intervalSignal) {
      const startedAt = dateAtTime(performance.date, intervalSignal);
      return startedAt
        ? new Date(startedAt.getTime() + intervalMinutes * 60000)
        : null;
    }
    return null;
  }

  function getCountdownState() {
    const target = ctx?.countdownTarget;
    if (!target) {
      return { minutes: null, state: "clear" };
    }
    const remainingMs = target.getTime() - Date.now();
    const countdownWindowMs = ((ctx.countdownWindowMinutes || 20) + 5) * 60000;
    if (remainingMs > 0) {
      if (remainingMs > countdownWindowMs) {
        return { minutes: null, state: "clear" };
      }
      return { minutes: Math.max(1, Math.ceil(remainingMs / 60000)), state: "counting" };
    }
    if (remainingMs >= -5 * 60000) {
      return { minutes: 0, state: "now" };
    }
    return { minutes: 0, state: "clear" };
  }

  function updateCountdown() {
    if (!ctx) {
      return;
    }
    const countdown = getCountdownState();
    ctx.countdown = countdown;
    const display = document.getElementById("countdown-display");
    const message = document.getElementById("countdown-caption");
    if (!display || !message) {
      return;
    }
    display.textContent = countdown.state === "counting"
      ? `${countdown.minutes} MIN`
      : (countdown.state === "now" ? "ACT II" : `~${ctx.countdownWindowMinutes} MIN INTERVAL`);
    display.classList.toggle("is-label", countdown.state === "clear");
    message.textContent = countdown.state === "counting"
      ? "Please make your way back to your seats when you hear the bell."
      : (countdown.state === "now"
        ? "Please take your seats. Act II is about to begin."
        : "Please enjoy the interval.");
  }

  async function advance() {
    clearTimer();
    if (!scheduler) {
      return;
    }
    // Holding state transitions are clock events, not cues. When the state
    // seen last render differs from now, the scheduler is rebuilt so its
    // canRender filter admits the new state's items - the change lands on
    // the next card, within a minute, which is all the design asks.
    if (ctx && route?.phase === "holding") {
      const state = holdingState(ctx).state;
      if (state !== holdingStateSeen) {
        holdingStateSeen = state;
        scheduler = new Scheduler(schedulerPlaylist, schedulerOptions);
        await scheduler.init();
      }
    }
    // The performance states move the same way (C21). In preview the clock
    // is deliberately ignored for this phase - every state card is in the
    // rotation at once - so there is nothing to rebuild.
    if (ctx && route?.phase === "performance" && ctx.performancePreview !== true) {
      const state = performanceState(ctx).state;
      if (state !== performanceStateSeen) {
        performanceStateSeen = state;
        scheduler = new Scheduler(schedulerPlaylist, schedulerOptions);
        await scheduler.init();
      }
    }
    const current = scheduler.next();
    const next = scheduler.previewNext();
    if (!current) {
      return;
    }
    setCaption(current);
    if (preview) {
      recordPreviewHistory(current);
    }
    if (isVideo(current)) {
      renderVideo(current);
    } else {
      renderSlide(current);
      if (!(preview && previewPaused)) {
        scheduleCurrent();
      }
    }
    if (preview) {
      updatePreviewNowShowing(current);
      refreshPreviewControls();
    }
    await updateState(current, next);
  }

  async function renderSingleRoute() {
    const current = { kind: "single", template: route.template, tag: route.name };
    setCaption(current);
    renderSlide(current);
    if (preview) {
      updatePreviewNowShowing(current);
    }
    await updateState(current, null);
  }

  // `holding` is an optional fourth playlist: when a pack has none, the phase
  // runs its postshow playlist rather than rendering SLIDE UNAVAILABLE or going
  // black. data-phase stays "holding" so the theme's phase intensity applies.
  // `holding` is an optional playlist: when a pack has none, the phase runs
  // its postshow playlist rather than rendering SLIDE UNAVAILABLE or going
  // black. `performance` (C21) is the same shape but falls back to the
  // engine's built-in state cards - the engine cannot fall back to the
  // camera; only OBS can show one (design, D1).
  async function loadPhasePlaylist(foyerPackBase, phase) {
    try {
      const playlist = await fetchJson(`${foyerPackBase}/playlists/${phase}.json`);
      if (phase === "holding" || phase === "performance") {
        // State-card anchors are the whole rotation, not interjections, so
        // an anchor with no every_n means "every position" - without this
        // the scheduler's every_n slot test never fires it.
        for (const item of playlist.items || []) {
          if (item.kind === "anchor" && !item.every_n) {
            item.every_n = 1;
          }
        }
        console.info(`${phase} phase: loaded playlists/${phase}.json`);
      }
      return playlist;
    } catch (error) {
      if (phase === "performance") {
        console.warn("performance phase: playlists/performance.json unavailable; using the built-in cards", error);
        const playlist = performanceDefaultPlaylist();
        for (const item of playlist.items || []) {
          if (item.kind === "anchor" && !item.every_n) {
            item.every_n = 1;
          }
        }
        return playlist;
      }
      if (phase !== "holding") {
        throw error;
      }
      console.warn("holding phase: playlists/holding.json unavailable; running the postshow playlist instead", error);
      return fetchJson(`${foyerPackBase}/playlists/postshow.json`);
    }
  }

  function heldRoutePlaylist(route, nextProductions) {
    const productionCount = nextProductions?.productions?.length || 0;
    return {
      items: (route.heldTemplates || [])
        .slice(0, productionCount)
        .map((template) => ({
          kind: "anchor",
          every_n: 1,
          template,
          tag: route.name,
          dwell_seconds: 11,
        })),
    };
  }

  async function buildScheduler() {
    showInfo = await getActiveShow();
    if (!showInfo?.paths?.foyerPack) {
      return;
    }
    const foyerPackBase = showInfo.paths.foyerPack;
    const showMeta = await fetchJson(`${foyerPackBase}/show.json`);
    let playlist = { items: [] };
    if (!route.template && !route.heldTemplates) {
      playlist = await loadPhasePlaylist(foyerPackBase, route.phase);
    }
    let nextProductions = { productions: [] };
    let archiveMemories = { memories: [] };
    let photoSizes = { sizes: {} };
    let performances = null;
    let visitingCompany = null;
    try {
      nextProductions = await fetchJson(`${foyerPackBase}/next_productions.json`);
    } catch (error) {
      console.warn("next_productions.json unavailable:", error);
    }
    try {
      archiveMemories = await fetchJson(`${foyerPackBase}/archive_memories.json`);
    } catch (error) {
      console.warn("archive_memories.json unavailable:", error);
    }
    // C18: photo-set layouts are planned from recorded photo shapes, never
    // from a loading image. Optional file - an absent record means {}.
    try {
      photoSizes = await fetchJson(`${foyerPackBase}/photo-sizes.json`);
    } catch (error) {
      console.warn("photo-sizes.json unavailable:", error);
    }
    try {
      performances = await fetchJson(`${foyerPackBase}/performances.json`);
    } catch (error) {
      console.warn("performances.json unavailable:", error);
    }
    // showday.json lives at the show root, a level up from the foyer pack.
    // It supplies the curtain offsets the holding states use when a
    // performance lacks bar_close / interval times; absent is fine (ruling 2).
    let showday = null;
    try {
      showday = await fetchJson(`${foyerPackBase.replace(/\/+$/, "").replace(/\/foyer-pack$/, "")}/showday.json`);
    } catch (error) {
      console.warn("showday.json unavailable:", error);
    }
    try {
      visitingCompany = await getVisitingCompany();
    } catch (error) {
      console.warn("visiting_company.json unavailable:", error);
    }
    if (route.heldTemplates) {
      playlist = heldRoutePlaylist(route, nextProductions);
    }
    const performance = selectPerformance(performances);
    const countdownWindowMinutes = minutesBetween(
      performance?.interval_at_estimated,
      performance?.act_2_at_estimated,
    ) || Number(showMeta?.interval_minutes) || 20;
    ctx = {
      show: showMeta,
      nextProductions,
      archiveMemories,
      photoSizes,
      performances,
      performance,
      showday,
      // The windows the loaded playlist actually opens. holdingWindows()
      // returns {0,0} for a playlist with no holding_state items, which pins
      // every holding-state check to overnight - old packs stay identical.
      holdingWindows: holdingWindows(playlist),
      visitingCompany,
      theme: resolvedTheme,
      videoItems: Object.fromEntries(
        (playlist.items || [])
          .filter(item => isVideo(item))
          .map(item => [item.source, item]),
      ),
      countdownTarget: countdownTarget(performance, showMeta),
      countdownWindowMinutes,
      countdown: { minutes: null, state: "clear" },
      foyerPackBase,
      // C21: pip paints the card + small-picture layout; performancePreview
      // lets preview mode show every state card (and the pending chips /
      // stand-in) regardless of the clock - ruling 4.
      pip: route?.pip === true,
      performancePreview: preview && route?.phase === "performance",
    };
    showLabel.textContent = showMeta.title || showInfo.id;
    phaseLabel.textContent = route.name;
    if (!route.template) {
      schedulerPlaylist = playlist;
      schedulerOptions = {
        dwellSeconds,
        activeTriggers: houseOpen ? ["house-open"] : [],
        canRender: (item) => canRenderSlide(item, ctx),
      };
      scheduler = new Scheduler(schedulerPlaylist, schedulerOptions);
      await scheduler.init();
      holdingStateSeen = route?.phase === "holding" ? holdingState(ctx).state : null;
      performanceStateSeen = route?.phase === "performance" ? performanceState(ctx).state : null;
    }
    currentPlaylistItems = playlist.items || [];
  }

  function renderUnavailableRoute() {
    const requested = escapeHTML(params.get("phase") || params.get("scene") || "unknown");
    phaseLabel.textContent = "Unavailable";
    caption.textContent = "";
    stage.innerHTML = `<div class="slide active">
      <p class="eyebrow alert">Foyer scene not built</p>
      <h2 class="headline small">SCENE UNAVAILABLE</h2>
      <p class="body">No foyer phase is registered for <b style="color:var(--poster-yellow);">${requested}</b>.</p>
    </div>`;
  }

  // =====================================================================
  // Preview / review controller (?preview=1). Builds on the engine hooks
  // above (advance / renderSlide / renderVideo / setCaption / clearTimer /
  // buildScheduler). None of this runs or mutates state in broadcast mode.
  // =====================================================================
  function previewProductionId(item) {
    return item?.production_id || referenceId(item?.production_ref) || null;
  }

  function previewSlideName(item) {
    const productionId = previewProductionId(item);
    const productions = ctx?.nextProductions?.productions || [];
    const production = productionId
      ? productions.find(candidate => candidate.id === productionId)
      : null;
    return production?.title
      || item?.label
      || item?.template
      || (item?.source ? item.source.split("/").pop() : (item?.tag || "?"));
  }

  function previewSlideLabel(item) {
    const id = item?.id || "current slide";
    return `${id} \u2014 ${previewSlideName(item)}`;
  }

  function updatePreviewNowShowing(item) {
    const target = document.getElementById("ngp-now");
    if (target) {
      target.textContent = item ? previewSlideLabel(item) : "No slide";
    }
  }

  function renderPreviewEntry(entry) {
    setCaption(entry);
    if (isVideo(entry)) {
      renderVideo(entry);
    } else {
      renderSlide(entry);
    }
    updatePreviewNowShowing(entry);
  }

  function recordPreviewHistory(entry) {
    previewHistory.push(entry);
    previewIndex = previewHistory.length - 1;
  }

  function updatePreviewPlayButton() {
    const btn = document.getElementById("ngp-play");
    if (btn) {
      btn.textContent = previewPaused ? "\u25B6 Play" : "\u275A\u275A Pause";
    }
    updateMotionNotice();
  }

  function updateMotionNotice() {
    const notice = document.getElementById("ngp-motion-notice");
    const message = document.getElementById("ngp-motion-message");
    if (!notice || !message) return;
    const reduced = document.body.classList.contains("motion-reduced");
    notice.hidden = !(reduced || previewPaused);
    message.textContent = reduced
      ? "Motion is off: reduced-motion mode shows still pictures and hides sparkles."
      : "Preview paused: pictures, story reveals and sparkles are frozen.";
    document.getElementById("ngp-motion-preview").textContent = reduced ? "Preview animations" : "Resume playback";
  }

  function previewPlay() {
    clearTimer();
    previewPaused = false;
    setStoryPaused(false);
    updatePreviewPlayButton();
    // Only a full-frame media item advances onended; an in-card clip must
    // not swallow the schedule, or the rotation would stall after resume.
    const video = stage.querySelector("video.ng-media");
    if (video) {
      video.play();
      return;
    }
    startWakeUpTicker();
    scheduleCurrent();
  }

  function previewPause() {
    if (!previewPaused && timer) remainingMs = Math.max(1, playbackDeadline - performance.now());
    previewPaused = true;
    clearTimer();
    setStoryPaused(true);
    updatePreviewPlayButton();
  }

  function previewTogglePlay() {
    if (previewPaused) {
      previewPlay();
    } else {
      previewPause();
    }
  }

  async function previewStep() {
    previewPaused = false;
    await advance();
    previewPause();
  }

  function previewPrev() {
    if (previewIndex <= 0) {
      return;
    }
    clearTimer();
    previewPaused = true;
    previewIndex -= 1;
    renderPreviewEntry(previewHistory[previewIndex]);
    // Every other control path refreshes the bar; this one did not, so after
    // PREV the JUMP select still named the newer slide and the FRAME group
    // stayed hidden on a montage. Reproduced and fixed 2026-09-10.
    refreshPreviewControls();
    updatePreviewPlayButton();
  }

  function previewJump(itemId) {
    const item = (currentPlaylistItems || []).find(candidate => candidate.id === itemId);
    if (!item) {
      return;
    }
    const entry = {
      ...item,
      template: item.template || null,
      source: item.source || null,
      production_id: referenceId(item.production_ref),
      dwell_seconds: item.dwell_seconds || 6,
    };
    clearTimer();
    recordPreviewHistory(entry);
    renderPreviewEntry(entry);
    setStoryPaused(previewPaused);
    if (!isVideo(entry)) scheduleCurrent();
    refreshPreviewControls();
    updatePreviewPlayButton();
  }

  async function previewSetPhase(name, pip) {
    const phaseParams = new URLSearchParams();
    phaseParams.set("phase", name);
    if (pip) {
      phaseParams.set("pip", "1");
    }
    const nextRoute = resolveRoute(phaseParams);
    if (!nextRoute) {
      return;
    }
    route = nextRoute;
    phase = route?.name || null;
    document.body.dataset.phase = route.phase || "unavailable";
    delete document.body.dataset.holdingState;
    syncHoldingStateAttr();
    clearTimer();
    scheduler = null;
    holdingStateSeen = null;
    performanceStateSeen = null;
    previewHistory.length = 0;
    previewIndex = -1;
    await buildScheduler();
    await advance();
    refreshPreviewControls();
  }

  function updatePreviewLinkNotice() {
    const target = document.getElementById("ngp-link-status");
    if (target) {
      target.textContent = previewLinkNotice;
      target.hidden = !previewLinkNotice;
    }
  }

  async function resolvePreviewCardRequest() {
    const cardId = params.get("card");
    if (!preview || !cardId) return null;
    const activeShow = await getActiveShow();
    const foyerPackBase = activeShow?.paths?.foyerPack;
    if (!foyerPackBase) return null;
    const phases = ["preshow", "interval", "postshow", "holding", "performance"];
    const playlists = await Promise.all(phases.map(async name => {
      // A pack without performance.json still serves the built-in cards, so
      // their ids must deep-link the same way (e.g. card=perf-act-two).
      const playlist = await fetchJson(`${foyerPackBase}/playlists/${name}.json`).catch(() => null);
      return {
        phase: name,
        playlist: playlist ?? (name === "performance" ? performanceDefaultPlaylist() : null),
      };
    }));
    const matches = playlists.flatMap(({ phase: matchPhase, playlist }) =>
      (playlist?.items || [])
        .filter(item => item.id === cardId)
        .map(item => ({ phase: matchPhase, item }))
    );
    const requestedPhase = params.get("phase")?.trim().toLowerCase();
    let target = matches.length === 1 ? matches[0] : null;
    if (matches.length > 1 && requestedPhase) {
      target = matches.find(match => match.phase === requestedPhase) || null;
    }
    if (matches.length > 1 && !target) {
      previewLinkNotice = `Card '${cardId}' exists in ${matches.map(match => match.phase).join(" and ")}; choose a phase.`;
    } else if (!matches.length) {
      previewLinkNotice = `Card '${cardId}' was not found; showing the phase start.`;
    }
    if (target) {
      const phaseParams = new URLSearchParams();
      phaseParams.set("phase", target.phase);
      if (params.get("pip") === "1") {
        phaseParams.set("pip", "1");
      }
      route = resolveRoute(phaseParams);
      phase = route.name;
      document.body.dataset.phase = route.phase;
      delete document.body.dataset.holdingState;
      syncHoldingStateAttr();
    }
    updatePreviewLinkNotice();
    return target;
  }

  function refreshPreviewControls() {
    if (!preview || !previewBarBuilt) {
      return;
    }
    document.querySelectorAll("#ngp-phases .ngp-btn").forEach(btn => {
      // The two performance tabs share data-phase - the pip flag tells them
      // apart so only the one actually on screen lights up.
      btn.classList.toggle("active",
        btn.dataset.phase === route?.phase
        && (btn.dataset.pip === "1") === Boolean(route?.pip));
    });
    const select = document.getElementById("ngp-jump");
    if (select) {
      const options = ['<option value="">Jump to slide\u2026</option>'].concat(
        (currentPlaylistItems || [])
          .filter(item => item.id)
          .map(item => {
            return `<option value="${escapeHTML(item.id)}">${escapeHTML(previewSlideLabel(item))}</option>`;
          }),
      );
      select.innerHTML = options.join("");
      select.value = previewHistory[previewIndex]?.id || "";
    }
    const currentItem = previewIndex >= 0 ? previewHistory[previewIndex] : null;
    const storyGroup = document.getElementById("ngp-story-group");
    if (storyGroup) {
      storyGroup.style.display = currentItem && currentItem.template === "story-montage" ? "" : "none";
    }
    updatePreviewNowShowing(currentItem);
    updatePreviewLinkNotice();
    updatePreviewPlayButton();
  }

  // build-info.json is fetched once and shared by the bar's shape (site key)
  // and its build stamp, so a preview-site bundle paints the right bar on the
  // first frame - never "ENGINE REVIEW" first. A missing or unreadable file
  // resolves to null, which is today's bar.
  let buildInfoPromise = null;
  function fetchBuildInfo() {
    if (!buildInfoPromise) {
      buildInfoPromise = fetch(`build-info.json?t=${Date.now()}`, { cache: "no-store" })
        .then(response => {
          if (!response.ok) {
            throw new Error("build-info.json unavailable");
          }
          return response.json();
        })
        .catch(() => null);
    }
    return buildInfoPromise;
  }

  function applyBuildStamp(target, info) {
    if (!target) {
      return;
    }
    if (!info) {
      target.textContent = "local / dev";
      return;
    }
    const built = info.built_at ? new Date(info.built_at) : null;
    // The version already carries the build date, so the second line only has
    // to add day, month and time. The full locale string stays on the tooltip.
    const builtShort = built
      ? built.toLocaleString(undefined, { day: "2-digit", month: "short", hour: "2-digit", minute: "2-digit" })
      : "unknown";
    target.textContent = info.version || "dev";
    target.title = `${info.version || "dev"} \u00B7 built ${built ? built.toLocaleString() : "unknown"}`;
    const builtEl = document.getElementById("ngp-built");
    if (builtEl) {
      builtEl.textContent = `built ${builtShort}`;
      builtEl.title = target.title;
    }
  }

  function fitPreviewCanvas() {
    if (!preview) {
      return;
    }
    const bar = document.querySelector(".ng-preview-bar");
    const barHeight = bar ? bar.getBoundingClientRect().height : 0;
    const availH = Math.max(0, window.innerHeight - barHeight);
    const scale = Math.min(window.innerWidth / 1920, availH / 1080);
    const scaledW = 1920 * scale;
    const scaledH = 1080 * scale;
    const left = Math.max(0, (window.innerWidth - scaledW) / 2);
    const top = barHeight + Math.max(0, (availH - scaledH) / 2);
    document.body.style.setProperty("--preview-scale", String(scale));
    document.body.style.setProperty("--preview-left", `${left}px`);
    document.body.style.setProperty("--preview-top", `${top}px`);
  }

  function setupPreview(buildInfo) {
    if (previewBarBuilt) {
      fitPreviewCanvas();
      return;
    }
    previewBarBuilt = true;
    document.body.classList.add("ng-preview");
    // Bundles built for the GitHub Pages preview site carry site:"preview" in
    // build-info.json (export_foyer.py --site preview). On those, the bar is
    // addressed to the director: plainer title, no HOLDING tab (its state
    // follows the real clock, so a daytime click looks broken), and a way back
    // to the index of shows. Everywhere else - localhost, the theatre, sticks,
    // older bundles - the bar is unchanged.
    const previewSite = Boolean(buildInfo && buildInfo.site === "preview");
    const bar = document.createElement("div");
    bar.className = "ng-preview-bar";
    bar.setAttribute("aria-label", previewSite ? "Foyer preview controls" : "Engine review controls");
    bar.innerHTML = `
      ${previewSite ? `<style>
        .ngp-allshows {
          display: block;
          font-family: 'JetBrains Mono', monospace;
          font-size: 10px;
          letter-spacing: 1px;
          text-transform: uppercase;
          color: var(--cream-2);
          text-decoration: none;
          margin-top: 2px;
        }
        .ngp-allshows:hover { color: var(--cream); }
        .ngp-allshows:focus-visible {
          outline: 2px solid var(--colour-accent);
          outline-offset: 2px;
          color: var(--cream);
        }
      </style>` : ""}
      <div class="ngp-brand">
        <span class="ngp-title">${previewSite ? "Foyer preview" : "ENGINE REVIEW"}</span>
        <span class="ngp-stamp" id="ngp-stamp">\u2026</span>
        <span class="ngp-built" id="ngp-built"></span>
        ${previewSite ? '<a class="ngp-allshows" href="../" title="Back to the list of shows">All shows</a>' : ""}
      </div>
      <div class="ngp-group" id="ngp-phases" role="tablist">
        <button class="ngp-btn" data-phase="preshow">Preshow</button>
        <button class="ngp-btn" data-phase="interval">Interval</button>
        <button class="ngp-btn" data-phase="postshow">Postshow</button>
        ${previewSite ? "" : '<button class="ngp-btn" data-phase="holding">Holding</button>'}
        <button class="ngp-btn" data-phase="performance">During</button>
        <button class="ngp-btn" data-phase="performance" data-pip="1">During + picture</button>
      </div>
      <div class="ngp-group">
        <button class="ngp-btn" id="ngp-prev" title="Previous shown slide">\u25C0 Prev</button>
        <button class="ngp-btn" id="ngp-play" title="Play / pause">\u275A\u275A Pause</button>
        <button class="ngp-btn" id="ngp-next" title="Next slide, then pause">Next \u25B6</button>
      </div>
      <div class="ngp-group" id="ngp-story-group" style="display:none;">
        <button class="ngp-btn" id="ngp-frame-prev" title="Previous story frame">\u25C0 Frame</button>
        <button class="ngp-btn" id="ngp-frame-next" title="Next story frame">Frame \u25B6</button>
      </div>
      <label class="ngp-field ngp-jump-field">Jump
        <select class="ngp-select" id="ngp-jump"></select>
      </label>
      <label class="ngp-field ngp-now-field">Now showing
        <span class="ngp-stamp" id="ngp-now">No slide</span>
      </label>
      <span class="ngp-stamp" id="ngp-link-status" role="status" hidden></span>
      <label class="ngp-field">Dwell
        <input type="number" class="ngp-input" id="ngp-dwell" min="2" max="60" step="1" placeholder="auto">s
      </label>
      <label class="ngp-field">Motion
        <select class="ngp-select" id="ngp-motion">
          <option value="system">System</option>
          <option value="full" selected>Full motion</option>
          <option value="reduced">Reduced</option>
        </select>
        <span class="ngp-stamp" id="ngp-motion-mode" title="Effective motion mode">auto</span>
      </label>
      <div id="ngp-motion-notice" role="status" hidden>
        <span id="ngp-motion-message"></span>
        <button class="ngp-btn" id="ngp-motion-preview">Preview animations</button>
      </div>
    `;
    document.body.appendChild(bar);
    bar.querySelectorAll("#ngp-phases .ngp-btn").forEach(btn => {
      btn.addEventListener("click", () => previewSetPhase(btn.dataset.phase, btn.dataset.pip === "1"));
    });
    document.getElementById("ngp-prev").addEventListener("click", previewPrev);
    document.getElementById("ngp-play").addEventListener("click", previewTogglePlay);
    document.getElementById("ngp-next").addEventListener("click", previewStep);
    document.getElementById("ngp-frame-prev").addEventListener("click", () => stepStoryFrame(-1));
    document.getElementById("ngp-frame-next").addEventListener("click", () => stepStoryFrame(1));
    document.getElementById("ngp-jump").addEventListener("change", event => {
      if (event.target.value) {
        previewJump(event.target.value);
      }
    });
    document.getElementById("ngp-dwell").addEventListener("change", event => {
      const value = Number(event.target.value);
      previewDwellOverride = Number.isFinite(value) && value > 0 ? value : null;
    });
    document.getElementById("ngp-motion").addEventListener("change", updateMotionPreference);
    const requestedMotion = params.get("motion");
    if (["full", "reduced", "system"].includes(requestedMotion)) {
      document.getElementById("ngp-motion").value = requestedMotion;
    }
    document.getElementById("ngp-motion-preview").addEventListener("click", () => {
      if (document.body.classList.contains("motion-reduced")) {
        document.getElementById("ngp-motion").value = "full";
        updateMotionPreference();
        const current = previewHistory[previewIndex];
        if (current && !isVideo(current)) renderPreviewEntry(current);
      }
      previewPlay();
    });
    updateMotionPreference();
    applyBuildStamp(document.getElementById("ngp-stamp"), buildInfo);
    fitPreviewCanvas();
    window.addEventListener("resize", fitPreviewCanvas);
    if ("ResizeObserver" in window) {
      new ResizeObserver(fitPreviewCanvas).observe(bar);
    }
  }

  let resolvedTheme = null;

  async function boot() {
    try {
      resolvedTheme = await loadTheme();
    } finally {
      // Reveal the shell only once the show palette is on it (style.css,
      // "no house-colour flash"). Set even if the theme load failed.
      document.documentElement.dataset.themeReady = "1";
    }
    if (preview) {
      setupPreview(await fetchBuildInfo());
    }
    if (!route) {
      renderUnavailableRoute();
      return;
    }
    const deepLinkTarget = preview ? await resolvePreviewCardRequest() : null;
    await buildScheduler();
    if (route.template) {
      await renderSingleRoute();
    } else {
      await advance();
    }
    if (deepLinkTarget) {
      previewPause();
      previewJump(deepLinkTarget.item.id);
    }
    if (preview) {
      refreshPreviewControls();
    }
  }

  document.addEventListener("show:changed", async () => {
    clearTimer();
    await boot();
  });

  startShowPolling();
  boot();
</script>
</body>
</html>
